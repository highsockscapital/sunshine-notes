name: Build Sunshine Notes Android

on:
  push:
    branches: ["**"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/android-build.yml"
      - ".github/actions/setup-node-with-cache/**"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      NDK_CCACHE: ccache
      USE_CCACHE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: ./.github/actions/setup-node-with-cache

      - name: Use specific Java version for the builds
        uses: joschi/setup-jdk@v2
        with:
          java-version: "17"
          architecture: "x64"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install node modules
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=mobile

      - name: Make Gradlew Executable
        run: cd apps/mobile/android && chmod +x ./gradlew

      - name: Build shared packages
        run: npm run tx mobile:build

      - name: Check for typescript errors
        run: |
          cd apps/mobile
          npx tsc --noEmit

      - name: Build release APKs
        run: |
          cd apps/mobile/android
          ENVFILE=.env.public ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          cd apps/mobile/android/app/build/outputs/apk/release
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if [ -f "app-$abi-release.apk" ]; then
              mv "app-$abi-release.apk" "$RUNNER_TEMP/apk/sunshinenotes-$abi.apk"
            fi
          done
          ls -la "$RUNNER_TEMP/apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-notes-apks
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload sourcemaps
        uses: actions/upload-artifact@v4
        with:
          name: sourcemaps
          path: |
            apps/mobile/android/app/build/**/*.map
            packages/editor-mobile/sourcemaps/*.map
          if-no-files-found: ignore
